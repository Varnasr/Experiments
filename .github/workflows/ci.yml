name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only: this workflow checks the repository and writes nothing back to it.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python3 scripts/check.py

      # An inline <script> ends at the first literal `</script` in the source,
      # whatever the JavaScript around it thinks. flipbook shipped a template
      # that emitted an unescaped one, which cut its own script in half and
      # left the whole tool dead with the markup rendering perfectly. No
      # browser and no network: this parses what the browser would be left
      # with. See the comment at the top of the script.
      - name: Inline scripts parse
        run: node scripts/check-inline-js.mjs

      # Link previews, the share row, sitemap.xml and robots.txt are written
      # from scripts/seo/tools.json. A hand edit to one page, or a new tool
      # added without re-running the script, fails here.
      - name: Link previews and share rows are current
        run: python3 scripts/seo.py --check

  # axe over every page, in a desktop and a phone viewport, plus a horizontal
  # overflow measurement at 390px. Separate from the job above because it
  # installs a browser and is the slow half; a contributor waiting on the
  # static checks should not wait on a Chromium download.
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      # playwright-core ships its own CLI, so the browser comes from the
      # pinned version in the lockfile rather than whatever npx resolves.
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node scripts/axe.mjs
