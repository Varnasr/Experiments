name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only: this workflow checks the repository and writes nothing back to it.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # The full history, because scripts/card-dates.py reads each tool's first
      # and latest commit and a shallow clone has neither.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python3 scripts/check.py

      # An inline <script> ends at the first literal `</script` in the source,
      # whatever the JavaScript around it thinks. flipbook shipped a template
      # that emitted an unescaped one, which cut its own script in half and
      # left the whole tool dead with the markup rendering perfectly. No
      # browser and no network: this parses what the browser would be left
      # with. See the comment at the top of the script.
      - name: Inline scripts parse
        run: node scripts/check-inline-js.mjs

      # Link previews, the share row, sitemap.xml and robots.txt are written
      # from scripts/seo/tools.json. A hand edit to one page, or a new tool
      # added without re-running the script, fails here.
      - name: Link previews and share rows are current
        run: python3 scripts/seo.py --check

      # Each card on the landing page says the month its tool was first
      # committed and the month it last changed. A tool edited without the
      # script being run again fails here.
      - name: Card dates match the git history
        run: python3 scripts/card-dates.py --check

      # The sampling arithmetic against values worked outside the page, and
      # the PPS draw against a second implementation. Node only, no browser.
      - name: Sampling design arithmetic
        run: node sampling-design/tests/core.mjs

      - name: Fiscal incidence arithmetic
        run: node fiscal-incidence/tests/core.mjs

      - name: Multiple testing and attrition bounds arithmetic
        run: node trial-checks/tests/core.mjs

      - name: Multidimensional poverty arithmetic
        run: node mpi-calculator/tests/core.mjs

      - name: Workbench estimators
        run: node causal-workbench/tests/core.mjs

      - name: Robustness value arithmetic
        run: node robustness-value/tests/core.mjs

      - name: Care valuation arithmetic and data
        run: node care-valuation/tests/core.mjs

      # 360 measurements WHO prints at -4 to +4 standard deviations, each
      # turned back into its number.
      - name: Child growth z-scores against the WHO tables
        run: node anthro-zscores/tests/core.mjs

      - name: Rupee converter arithmetic and data
        run: node rupee-converter/tests/core.mjs

  # axe over every page, in a desktop and a phone viewport, plus a horizontal
  # overflow measurement at 390px. Separate from the job above because it
  # installs a browser and is the slow half; a contributor waiting on the
  # static checks should not wait on a Chromium download.
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      # playwright-core ships its own CLI, so the browser comes from the
      # pinned version in the lockfile rather than whatever npx resolves.
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node scripts/axe.mjs

      # The phonics path in kundendu-worksheets must never ask a child to read
      # a letter it has not taught him yet. Module 3 said six letters was
      # enough to read real words and then showed him cat, van and bag, and
      # nothing failed: the worksheet generated, the answers marked, the book
      # turned its pages. Only sitting with him would have found it. This
      # drives each lesson's own generator rather than reading its word bank,
      # because the bank was never wrong; the lesson reached past it.
      - name: Phonics lessons stay inside the letters taught
        run: node kundendu-worksheets/tests/sequence.mjs
